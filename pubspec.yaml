name: Screenique
description: "Your very own gift for yourself."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  sensors_plus: ^5.0.0
  
  # --- UI & Experience ---
  shared_preferences: ^2.2.2
  lottie: ^3.1.0
  palette_generator: ^0.3.3+3
  cupertino_icons: ^1.0.8

  # --- Authentication & Backend ---
  google_sign_in: ^6.2.1
  firebase_core: ^4.3.0
  firebase_auth: ^6.1.3
  cloud_firestore: ^6.1.1

  # --- Network & Tools ---
  http: ^1.6.0
  dio: ^5.9.0
  cached_network_image: ^3.4.1
  flutter_riverpod: ^3.1.0
  intl: ^0.20.2
  share_plus: ^12.0.1
  
  # --- Utilities ---
  screenshot: ^3.0.0
  path_provider: ^2.1.2
  pdf: ^3.10.8

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Launcher icons must only be in dev_dependencies
  flutter_launcher_icons: ^0.13.1 
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/animations/Popcorn.json
    - assets/logo11.png
    - assets/logo12.png
    - assets/signature11.png
    - assets/stardust.png

# --- LAUNCHER ICONS CONFIG ---
# (Zero spaces before this line)
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/logo11.png"
  adaptive_icon_background: "#F5EADE"
  adaptive_icon_foreground: "assets/logo11.png"