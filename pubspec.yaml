name: Screenique
description: "Your very own gift for yourself."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  sensors_plus: ^5.0.0
  
  # --- UI & Experience ---
  shared_preferences: ^2.2.2
  lottie: ^3.1.0
  palette_generator: ^0.3.3+3
  cupertino_icons: ^1.0.8

  # --- Authentication & Backend ---
  google_sign_in: ^6.2.1
  firebase_core: ^3.6.0
  firebase_auth: ^5.3.1
  cloud_firestore: ^5.4.4
  firebase_analytics: ^11.3.3
  firebase_remote_config: ^5.1.3

  # --- Network & Tools ---
  http: ^1.6.0
  dio: ^5.9.0
  cached_network_image: ^3.4.1
  flutter_riverpod: ^3.1.0
  intl: ^0.20.2
  share_plus: ^12.0.1
  
  # --- Utilities ---
  screenshot: ^3.0.0
  path_provider: ^2.1.2
  pdf: ^3.10.8
  flutter_dotenv: ^6.0.1
  xml: ^6.6.1
  url_launcher: ^6.3.2
  html: ^0.15.6
  table_calendar: ^3.2.0
  flutter_local_notifications: ^21.0.0
  visibility_detector: ^0.4.0+2
  record: ^6.2.1
  permission_handler: ^12.0.3
  flutter_speed_dial: ^7.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Launcher icons must only be in dev_dependencies
  flutter_launcher_icons: ^0.13.1 
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/world.geojson
    - assets/animations/Popcorn.json
    - assets/logo11.png
    - assets/logo12.png
    - assets/signature11.png
    - assets/stardust.png
    - assets/google_logo.png
    - assets/bot_logo.png

# --- LAUNCHER ICONS CONFIG ---
# (Zero spaces before this line)
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/logo11.png"
  adaptive_icon_background: "#F5EADE"
  adaptive_icon_foreground: "assets/logo11.png"